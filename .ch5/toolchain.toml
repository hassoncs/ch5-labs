schemaVersion = 1

[repo]
id = "ch5-labs"
kind = "monorepo"
packageManager = "bun"
lockfiles = ["bun.lock", "package.json", "turbo.json"]

[[verify]]
name = "repository structure: package.json"
command = "test -f package.json"

[[verify]]
name = "no publishConfig.registry override (would hide packages from esm.sh)"
command = "! grep -rl '\"registry\"' packages/*/package.json"

[[verify]]
name = "Turbo workspace graph"
command = "bun run build --dry=json >/dev/null"

[deps]
install = "bun install"

[warm]
command = "bun install"
