<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Stamp</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p>ch5-labs / pixel-stamp</p>
          <h1>Stamp pixels.</h1>
        </div>
        <div class="tools">
          <input id="color" type="color" value="#ff4d8d" aria-label="Pixel color">
          <button id="randomize" type="button">Random stamp</button>
          <button id="clear" type="button">Clear</button>
        </div>
      </header>
      <div id="grid" aria-label="Pixel drawing grid"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
