<!doctype html>
<html lang="en">

    <title>Tiny Oracle</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">ch5-labs / tiny-oracle</p>

    <script type="module" src="./main.js"></script>
